name: Spine
options:
  bundleIdPrefix: com.shimondeitel.spine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Spine:
    type: application
    platform: iOS
    sources:
      - path: Spine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.spine
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Spine/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  SpineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpineTests
      - path: Spine.storekit
    dependencies:
      - target: Spine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.spine.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  SpineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpineUITests
    dependencies:
      - target: Spine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.spine.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Spine:
    build:
      targets:
        Spine: all
        SpineTests: [test]
        SpineUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Spine.storekit
    test:
      config: Debug
      storeKitConfiguration: Spine.storekit
      targets:
        - SpineTests
        - SpineUITests
    archive:
      config: Release
